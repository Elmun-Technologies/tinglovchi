name: Fly Deploy

# Puts the one-button recorder (/yoz) and its Telegram bot online on Fly.io.
#
# Everything comes from this repository's secrets (Settings → Secrets and variables → Actions):
#   FLY_API_TOKEN       required — fly.io → Account → Access Tokens
#   ANTHROPIC_API_KEY   required — console.anthropic.com → API Keys
#   ASSEMBLYAI_API_KEY  required — assemblyai.com → API Keys
#   SUHBAT_ACCESS_CODE  required — the team's password for the site and the bot
#   TELEGRAM_BOT_TOKEN  optional — @BotFather → /newbot
#   TELEGRAM_TEAM_CHAT_ID, ANTHROPIC_MODEL, FLY_ORG  optional
# Run it from Actions → Fly Deploy → Run workflow. Re-running is safe: every step checks before it creates.

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    env:
      APP: tinglovchi-staging-web
      REGION: fra
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check required secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          SUHBAT_ACCESS_CODE: ${{ secrets.SUHBAT_ACCESS_CODE }}
        run: |
          missing=""
          for name in FLY_API_TOKEN ANTHROPIC_API_KEY ASSEMBLYAI_API_KEY SUHBAT_ACCESS_CODE; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Ensure the app and its storage volume exist
        env:
          FLY_ORG: ${{ secrets.FLY_ORG }}
        run: |
          if ! flyctl status -a "$APP" >/dev/null 2>&1; then
            flyctl apps create "$APP" --org "${FLY_ORG:-personal}"
          fi
          if ! flyctl volumes list -a "$APP" --json | grep -q '"suhbat_data"'; then
            flyctl volumes create suhbat_data --region "$REGION" --size 10 -a "$APP" --yes
          fi

      - name: Store keys as Fly secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          SUHBAT_ACCESS_CODE: ${{ secrets.SUHBAT_ACCESS_CODE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TEAM_CHAT_ID: ${{ secrets.TELEGRAM_TEAM_CHAT_ID }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        run: |
          # Values go through stdin so they never appear in a command line.
          for name in ANTHROPIC_API_KEY ASSEMBLYAI_API_KEY SUHBAT_ACCESS_CODE TELEGRAM_BOT_TOKEN TELEGRAM_TEAM_CHAT_ID ANTHROPIC_MODEL; do
            if [ -n "${!name}" ]; then printf '%s=%s\n' "$name" "${!name}"; fi
          done | flyctl secrets import --stage -a "$APP"

      - name: Deploy
        run: flyctl deploy --remote-only -a "$APP"

      - name: Connect the Telegram bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN not set; skipping the bot."
            exit 0
          fi
          # Same derivation as webhookSecret() in apps/web/src/lib/quick/telegram.ts.
          secret=$(printf '%s' 'suhbat-telegram-webhook' | openssl dgst -sha256 -hmac "$TELEGRAM_BOT_TOKEN" | awk '{print $NF}')
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=https://${APP}.fly.dev/api/quick/telegram" \
            --data-urlencode "secret_token=${secret}" \
            --data-urlencode 'allowed_updates=["message"]' > /dev/null
          echo "Telegram webhook registered."

      - name: Check the site answers
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS -o /dev/null "https://${APP}.fly.dev/yoz"; then
              echo "Live at https://${APP}.fly.dev/yoz"
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://${APP}.fly.dev/yoz did not answer"
          exit 1
