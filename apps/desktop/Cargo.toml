[workspace]
resolver = "2"
members = ["src-tauri", "crates/recorder-core", "crates/capture-macos"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
recorder-core = { path = "crates/recorder-core" }
capture-macos = { path = "crates/capture-macos" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.dev]
debug = 1
