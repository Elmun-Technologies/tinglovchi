app = "tinglovchi-staging-web"
primary_region = "fra"

[build]

[build.args]
  NEXT_PUBLIC_SUPABASE_URL = "https://ivppuyliugowykslvatf.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_hPGKot9gNVws6y8Yg23-_w_9Fk8BiIt"
  NEXT_PUBLIC_APP_NAME = "SUHBAT AI"

[env]
  APP_URL = "https://tinglovchi-staging-web.fly.dev"
  SUHBAT_DATA_MODE = "live"
  # One-button recorder (/yoz): recordings and analyses live on the volume below.
  SUHBAT_DATA_DIR = "/data"
  TRANSCRIPTION_PROVIDER = "assemblyai"

# Create once: fly volumes create suhbat_data --region fra --size 10
[mounts]
  source = "suhbat_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Analysis runs inside the web process after an upload; a stopped machine would pause it until the next
  # visit, so keep one machine running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
